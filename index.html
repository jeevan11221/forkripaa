<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For Kripa ❤️</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Georgia, serif;
      color: white;
      background: #0a0710;
    }

    /* ================= BACKGROUND ================= */
    .wall {
      position: fixed;
      inset: 0;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      padding: 16px;
      z-index: 0;
    }

    .col {
      overflow: hidden;
      border-radius: 20px;
    }

    .track {
      display: flex;
      flex-direction: column;
      gap: 16px;
      animation: scroll 40s linear infinite;
    }

    .col:nth-child(2) .track {
      animation-direction: reverse;
      animation-duration: 50s;
    }

    .col:nth-child(3) .track {
      animation-duration: 45s;
    }

    .track img {
      width: 100%;
      height: calc(100vh - 32px);
      object-fit: cover;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      filter: saturate(1.1) contrast(1.05) brightness(1);
    }

    @keyframes scroll {
      from { transform: translateY(0); }
      to { transform: translateY(-100%); }
    }

    /* DARK OVERLAY (NO BLUR NOW) */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      z-index: 1;
    }

    /* ================= CARD ================= */
    .center {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 5;
    }

    .card {
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 25px;
      padding: 40px;
      text-align: center;
      width: 90%;
      max-width: 600px;

      box-shadow:
        0 30px 80px rgba(0,0,0,0.45),
        inset 0 1px 0 rgba(255,255,255,0.15);
    }

    h1 {
      margin: 0;
      font-size: 2.5rem;
    }

    p {
      margin-top: 15px;
      opacity: 0.9;
    }

    /* ================= BUTTONS ================= */
    .btn {
      padding: 12px 25px;
      border: none;
      border-radius: 999px;
      font-weight: bold;
      cursor: pointer;
      margin: 20px;
      font-size: 1rem;
    }

    .yes {
      background: linear-gradient(45deg,#ff4d8d,#ff7aa8);
      color: white;
    }

    .no {
      position: fixed;
      pointer-events: none;
      background: gray;
      color: white;
    }

    /* ================= LOVE ================= */
    .love {
      display: none;
      font-size: 2rem;
    }

    /* ================= HEARTS ================= */
    .heart {
      position: fixed;
      bottom: -20px;
      font-size: 20px;
      animation: float 6s linear forwards;
    }

    @keyframes float {
      to {
        transform: translateY(-110vh);
        opacity: 0;
      }
    }

  </style>
</head>

<body>

<!-- BACKGROUND -->
<div class="wall">
  <div class="col"><div class="track">
    <img src="Kripa1/image1.jpeg">
    <img src="Kripa1/image2.jpeg">
    <img src="Kripa1/image3.jpeg">
    <img src="Kripa1/image1.jpeg">
    <img src="Kripa1/image2.jpeg">
    <img src="Kripa1/image3.jpeg">
  </div></div>

  <div class="col"><div class="track">
    <img src="Kripa1/image4.jpeg">
    <img src="Kripa1/image5.jpeg">
    <img src="Kripa1/image6.jpeg">
    <img src="Kripa1/image4.jpeg">
    <img src="Kripa1/image5.jpeg">
    <img src="Kripa1/image6.jpeg">
  </div></div>

  <div class="col"><div class="track">
    <img src="Kripa1/image7.jpeg">
    <img src="Kripa1/image8.jpeg">
    <img src="Kripa1/image9.jpeg">
    <img src="Kripa1/image7.jpeg">
    <img src="Kripa1/image8.jpeg">
    <img src="Kripa1/image9.jpeg">
  </div></div>
</div>

<div class="overlay"></div>

<!-- CARD -->
<div class="center">
  <div class="card">

    <div id="main">
      <h1>Kripa, will you be my girlfriend?</h1>
      <p>You already know the right answer ❤️</p>

      <button class="btn yes" onclick="yesClick()">Yes</button>
    </div>

    <div id="love" class="love">
      I love you so much, Kripa ❤️
    </div>

  </div>
</div>

<button id="noBtn" class="btn no">No</button>

<audio id="music" src="music.mp3"></audio>

<script>
  const noBtn = document.getElementById("noBtn");
  const yesBtn = document.querySelector(".yes");

  function moveNo() {
    const yesRect = yesBtn.getBoundingClientRect();
    const w = window.innerWidth - 120;
    const h = window.innerHeight - 50;

    let x, y;

    do {
      x = Math.random() * w;
      y = Math.random() * h;
    } while (
      x > yesRect.left - 100 &&
      x < yesRect.right + 100 &&
      y > yesRect.top - 100 &&
      y < yesRect.bottom + 100
    );

    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
  }

  document.addEventListener("mousemove", e => {
    const rect = noBtn.getBoundingClientRect();
    if (
      e.clientX > rect.left - 80 &&
      e.clientX < rect.right + 80 &&
      e.clientY > rect.top - 80 &&
      e.clientY < rect.bottom + 80
    ) {
      moveNo();
    }
  });

  function yesClick() {
    document.getElementById("main").style.display = "none";
    document.getElementById("love").style.display = "block";
    document.getElementById("music").play();

    setInterval(() => {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.innerText = "❤️";
      heart.style.left = Math.random() * 100 + "vw";
      document.body.appendChild(heart);

      setTimeout(() => heart.remove(), 6000);
    }, 200);
  }

  moveNo();
</script>

</body>
</html>
